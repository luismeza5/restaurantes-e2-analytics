# Defaults applied when running spark-submit with --properties-file.
spark.sql.session.timeZone        America/Costa_Rica
spark.sql.shuffle.partitions      8
spark.sql.adaptive.enabled        true
spark.serializer                  org.apache.spark.serializer.KryoSerializer
# JDBC driver for the Postgres warehouse load (fetched from Maven on first run).
spark.jars.packages               org.postgresql:postgresql:42.7.3
